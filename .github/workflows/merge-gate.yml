name: Merge Gate

on:
  push:
    branches: [master, main]

permissions:
  contents: read
  security-events: write

concurrency:
  group: merge-gate-${{ github.ref }}
  cancel-in-progress: true

jobs:
  pr-gate:
    name: PR Quality Gate
    uses: ./.github/workflows/pr-gate.yml

  codeql-build:
    name: CodeQL Build (UI)
    if: false  # Requires GHAS on private repo; enable when licensed or repo is public
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    permissions:
      security-events: write
    defaults:
      run:
        working-directory: mathprover-ui
    steps:
      - uses: actions/checkout@v4
      - run: corepack enable
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: pnpm install --frozen-lockfile
      - uses: github/codeql-action/init@v3
        with:
          languages: javascript-typescript
          build-mode: manual
      - run: pnpm run build
      - uses: github/codeql-action/analyze@v3

  required-checks:
    name: Required Checks (Merge)
    runs-on: ubuntu-latest
    needs: [pr-gate]
    if: always()
    steps:
      - name: Verify merge gate passed
        run: |
          if [ "${{ needs.pr-gate.result }}" != "success" ]; then
            echo "::error::Merge gate failed."
            exit 1
          fi
          echo "Merge gate passed."
