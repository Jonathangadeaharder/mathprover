name: PR Quality Gate

on:
  pull_request:
    branches: [master, main]
  workflow_call:

permissions:
  contents: read
  security-events: write

concurrency:
  group: pr-gate-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

env:
  PYTHON_VERSION: "3.12"

jobs:
  repo-hygiene:
    name: Repo Hygiene
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - name: Check for iCloud sync conflicts
        run: |
          if find . -path ./mathprover-ui/node_modules -prune -o -path ./.git -prune -o -name "* [0-9]*" -print | grep -q .; then
            echo "::error::iCloud sync conflicts detected"
            find . -path ./mathprover-ui/node_modules -prune -o -path ./.git -prune -o -name "* [0-9]*" -print
            exit 1
          fi

  structure:
    name: Format Check (structurelint)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - run: structurelint

  ui-format:
    name: UI Format (prettier)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: mathprover-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm exec prettier --check .

  ui-typecheck:
    name: UI Type Check
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: mathprover-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm run check

  ui-build:
    name: UI Build
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    defaults:
      run:
        working-directory: mathprover-ui
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: corepack enable && pnpm install --frozen-lockfile
      - run: pnpm run build

  python-lint:
    name: Lint (ruff)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uvx ruff check agents scripts --output-format=github

  python-format:
    name: Format (ruff)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uvx ruff format --check --diff agents scripts

  python-typecheck:
    name: Typecheck (pyright)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uv sync --directory agents
      - run: uvx pyright

  semgrep:
    name: Semgrep SAST
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    if: github.event.pull_request == null || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}
      - run: uvx semgrep --config .semgrep.yml --error agents scripts

  codeql:
    name: CodeQL Analysis
    runs-on: ubuntu-latest
    if: false  # Private repo: requires GitHub Advanced Security license to upload SARIF
    permissions:
      contents: read
      security-events: write
      actions: read
    timeout-minutes: 30
    steps:
      - run: echo "Enable GHAS or make repo public to activate CodeQL"

  required-checks:
    name: Required Checks (PR)
    runs-on: ["self-hosted", "macos", "arm64", "VidiomTM"]
    needs:
      - repo-hygiene
      - structure
      - ui-format
      - ui-typecheck
      - ui-build
      - python-lint
      - python-format
      - python-typecheck
      - semgrep
    if: always()
    steps:
      - name: Verify all jobs passed
        run: |
          if [ "${{ needs.repo-hygiene.result }}" != "success" ] || \
             [ "${{ needs.structure.result }}" != "success" ] || \
             [ "${{ needs.ui-format.result }}" != "success" ] || \
             [ "${{ needs.ui-typecheck.result }}" != "success" ] || \
             [ "${{ needs.ui-build.result }}" != "success" ] || \
             [ "${{ needs.python-lint.result }}" != "success" ] || \
             [ "${{ needs.python-format.result }}" != "success" ] || \
             [ "${{ needs.python-typecheck.result }}" != "success" ] || \
             [ "${{ needs.semgrep.result }}" != "success" ]; then
            echo "::error::One or more PR gate jobs failed."
            exit 1
          fi
          echo "All PR gate jobs passed."
