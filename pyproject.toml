[project]
name = "mathprover"
version = "0.1.0"
description = "MathProver tooling (agents + scripts)"
requires-python = ">=3.10"
dependencies = []

[tool.ruff]
line-length = 100
target-version = "py310"
src = ["agents", "scripts"]

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
ignore = ["E501"]

[tool.ruff.lint.per-file-ignores]
"agents/prompts.py" = ["E501"]

[tool.pyright]
include = ["agents", "scripts"]
extraPaths = ["agents"]
venvPath = "agents"
venv = ".venv"
pythonVersion = "3.10"
typeCheckingMode = "basic"
reportMissingImports = "warning"
