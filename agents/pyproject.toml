[project]
name = "mathprover-agents"
version = "0.1.0"
description = "Dispatch router for local OpenAI-compatible and Aristotle provers"
requires-python = ">=3.10"
dependencies = [
    "pydantic-ai>=1.0.0",
    "aristotlelib>=2.0.0",
    "tomli>=2.0.0; python_version < '3.11'",
]

[project.scripts]
mathprover-dispatch = "dispatch:main"
mathprover-preview = "preview:main"

[tool.uv]
package = false
